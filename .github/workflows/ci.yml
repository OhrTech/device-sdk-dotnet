name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet workload install android maui-android

      # net.ohrtech:device-sdk comes from Maven Central (AndroidMavenLibrary).
      - run: dotnet build -c Release
      - run: dotnet pack src/OhrTech.Device -c Release --no-build -o artifacts
      - run: dotnet pack src/OhrTech.Device.Maui -c Release --no-build -o artifacts
